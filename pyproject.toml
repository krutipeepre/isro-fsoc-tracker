[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isro-fsoc-milestone1"
version = "0.1.0"
description = "CPU-friendly virtual camera geometry simulator for FSOC coarse alignment"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
